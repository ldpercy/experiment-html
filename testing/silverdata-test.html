<!doctype html>
<html lang="en">
<head>
	<title>silverdata test</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[common]/module.js"></script>
	<!-- <script defer src="../../[common]/common-script.js"></script> -->
</head>
<body>
	<page-header>
		<span slot="h1">silverdata test</span>
	</page-header>

	<main>

		<style contenteditable="plaintext-only">
		</style>


		<form name="silverdata-test">
			<h2>silverdata-test</h2>

			<label>base path</label>
			<input type="text" name="basePath" value="/silver-language/silverdata-js/test/">

			<button type="button" name="load-silverdata-test">
				load silverdata-test
			</button>
			<button type="button" name="load-and-flatten">
				load & flatten
			</button>
		</form>


		<script type="module">
			import { importFile, importJson } from '../[common]/file.js';
			import { render } from '../[common]/js-to-html.js';

			var basePath = '';

			/** loadTestDirectory
			 * @param {string} directoryPath
			 * @return {Promise<TestDirectory>}
			 */
			async function loadTestDirectory(directoryPath) {
				const result = {
					path	: directoryPath,
					item	: []
				};

				/** @type Array<TestDirEntry> */
				try {
					result.item = await importJson(`${basePath}${directoryPath}_test.json`);

					result.item = await Array.fromAsync(
						result.item,
						(item) => {
							let result;
							if (item.endsWith('/')) {
								result = loadTestDirectory(item);
							}
							else {
								result = item;
							}
							//console.log(`Array.fromAsync`,result);
							return result;
						}
					);
				}
				catch {
					console.log(`Can't load ${basePath}${directoryPath}_test.json`);
				}

				console.log('--loadTestDirectory', directoryPath, result);

				return result;
			}/* loadTestDirectory */



			/** flattenSubdirectories
			 * @param {directory} directory
			 * @return {array<directory>}
			 */
			function flattenSubdirectories(directory) {
				const result = [
					{
						path: directory.path,
						item: [],
					}
				];

				for (const item of directory.item.values()) {

					if (typeof item === 'string') {
						result[0].item.push(item);
					}
					else if (typeof item === 'object') {
						result.push(
							{
								path: `${directory.path}${item.path}`,
								item: item.item,
							}
						);
					}

					//console.log(index, element);
					//elements += `<tr><th>${index}</th><td>${render(element)}</td></tr>`;
				}
				return result;
			}/* flattenSubdirectories */


			/* loadSilverdataTest */
			async function loadSilverdataTest() {
				basePath = document.forms['silverdata-test']['basePath'].value;
				const result = await loadTestDirectory('/');
				console.log(result);
				document.getElementById('data-output').render(result);
			}/* loadSilverdataTest */

			/* loadSilverdataTest */
			async function loadAndFlatten() {
				basePath = document.forms['silverdata-test']['basePath'].value;
				const result = await loadTestDirectory('/');
				const flattened = flattenSubdirectories(result);
				console.log(flattened);
				document.getElementById('data-output').render(flattened);
			}/* loadAndFlatten */


			document.forms['silverdata-test']['load-silverdata-test'].addEventListener('click', loadSilverdataTest);
			document.forms['silverdata-test']['load-and-flatten'].addEventListener('click', loadAndFlatten);


			loadSilverdataTest();

		</script>

		<output >

			<data-view id="data-output"></data-view>

		</output>




	</main>


</body>
</html>
