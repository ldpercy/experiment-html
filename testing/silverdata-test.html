		<form name="silverdata-test">

		<script type="module">
			import { importFile, importJson } from '../[common]/file.js';
			import { render } from '../[common]/js-to-html.js';

			var basePath = '';

			/** loadTestDirectory
			 * @param {string} directoryPath
			 * @return {Promise<TestDirectory>}
			 */
			async function loadTestDirectory(directoryPath) {
				const result = {
					path	: directoryPath,
					entry	: []
				};

				/** @type Array<TestDirEntry> */
				result.entry = await importJson(`${basePath}${directoryPath}_test.json`);


				result.entry = await Array.fromAsync(
					result.entry,
					(item) => {
						if (item.endsWith('/')) {
							//return "its a dir";
							const subDir = loadTestDirectory(item);
							return subDir;
						}
						else {
							return item;
						}
					}
				);


				console.log('--loadTestDirectory', directoryPath, result);

				return result;
			}/* loadTestDirectory */


			/* loadSilverdataTest */
			async function loadSilverdataTest() {
				basePath = document.forms['silverdata-test']['basePath'].value;

				const result = await loadTestDirectory('/');
				console.log(result);

				document.getElementById('htmlOutput').innerHTML = render(result);
				document.getElementById('jsonOutput').innerHTML = JSON.stringify(result,undefined, '	');
			}

			document.forms['silverdata-test']['load-silverdata-test'].addEventListener('click', loadSilverdataTest);

			 * @param {directory} directory
			 * @return {array<directory>}
			 */

					//console.log(index, element);

				}

			}



			loadSilverdataTest();

		</script>

		<output >
			<h3>html output</h3>
			<div id="htmlOutput"></div>
			<h3>json output</h3>
			<pre id="jsonOutput"></pre>
		</output>


	</main>
